<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <section>
        <div>
          <h1 class="title">Trivia Quiz</h1>
          <button id="Quick-button">Quick play</button>
          <button id="start-button">Start quiz</button>

          <div class="inputs">
            <section>
              <input
                type="number"
                id="num-questions"
                placeholder="type amauont texts"
              />

              <label for="mySelect">Choose an option:</label>
              <select id="mySelect">
                <option value="">-- Select --</option>
              </select>
            </section>
          </div>
        </div>
      </section>

      <section>
        <div class="quiz-info">
          <p id="status" aria-live="polite"></p>
          <h2 id="category"></h2>
          <p id="difficulty"></p>
          <p id="type"></p>
          <p id="questions"></p>
          <p id="timer"></p>
        </div>
      </section>
    </div>
    <script src="app.js"></script>
    <script src="dropdown.js"></script>
  </body>
</html>
